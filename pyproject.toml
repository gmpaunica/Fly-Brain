[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain"
version = "0.1.0"
description = "Educational deterministic 2D fly simulation"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
neural = ["torch>=2.6,<3", "numpy>=1.26,<3"]
plots = ["matplotlib>=3.9,<4"]
flight3d = ["panda3d>=1.10.16,<1.11", "pyarrow>=19,<24", "torch>=2.6,<3", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flybrain.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
